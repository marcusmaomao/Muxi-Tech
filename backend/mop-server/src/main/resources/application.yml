server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: mop-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mop}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:mop}
    password: ${MYSQL_PASSWORD:mop}
    hikari:
      maximum-pool-size: 10
      pool-name: mop
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

mop:
  jwt:
    secret: ${MOP_JWT_SECRET:}
    ttl-seconds: ${MOP_JWT_TTL_SECONDS:7200}
  demo:
    seed: ${MOP_DEMO_SEED:false}
    admin-username: ${MOP_DEMO_ADMIN_USERNAME:admin}
    admin-password: ${MOP_DEMO_ADMIN_PASSWORD:}
    admin-display-name: ${MOP_DEMO_ADMIN_DISPLAY_NAME:平台管理员}
    tenant-code: ${MOP_DEMO_TENANT_CODE:demo}
    tenant-name: ${MOP_DEMO_TENANT_NAME:演示租户}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: mop-server
    description: 沐曦本体平台

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId}] %logger{40} - %msg%n"
