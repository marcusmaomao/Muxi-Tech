name: mop

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_server_default__listen__address: 0.0.0.0
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "(command -v wget >/dev/null && wget -q -O /dev/null http://127.0.0.1:7474) || (command -v curl >/dev/null && curl -fsS http://127.0.0.1:7474 >/dev/null) || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Docker Hub 已下架 minio/minio（2026-09）。这里改用仍可匿名拉取的 Chainguard 构建，进程仍是 MinIO，不链入应用。
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  mop-server:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    image: mop-server:${MOP_TAG:-dev}
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MOP_JWT_SECRET: ${MOP_JWT_SECRET}
      MOP_DEMO_SEED: ${MOP_DEMO_SEED}
      MOP_DEMO_GRID: ${MOP_DEMO_GRID:-true}
      MOP_DEMO_ADMIN_USERNAME: ${MOP_DEMO_ADMIN_USERNAME}
      MOP_DEMO_ADMIN_PASSWORD: ${MOP_DEMO_ADMIN_PASSWORD}
      MOP_CAPTCHA_EXPOSE: ${MOP_CAPTCHA_EXPOSE:-false}
      MOP_DATASOURCE_SECRET: ${MOP_DATASOURCE_SECRET}
      MOP_AI_KEY_SECRET: ${MOP_AI_KEY_SECRET:-local-dev-ai-key-secret-32b}
      MOP_AI_RATE_LIMIT: redis
      MOP_MODEL_VIEW_CACHE: redis
      REDIS_HOST: redis
      MOP_STORAGE_ENDPOINT: http://minio:9000
      MOP_STORAGE_ACCESS_KEY: ${MINIO_USER}
      MOP_STORAGE_SECRET_KEY: ${MINIO_PASSWORD}
      MOP_STORAGE_BUCKET: mop
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    image: mop-web:${MOP_TAG:-dev}
    ports:
      - "8899:80"
    depends_on:
      mop-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

  llm-mock:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--disable-gzip"]
    volumes:
      - ./llm-mock:/home/wiremock
    ports:
      - "8089:8080"

volumes:
  mysql-data: {}
  neo4j-data: {}
  minio-data: {}
