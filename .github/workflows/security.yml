name: security

on:
  pull_request:
  schedule:
    - cron: "0 16 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether dependency review is available
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          url="https://api.github.com/repos/${{ github.repository }}/dependency-graph/compare/${base}...${head}"
          code=$(curl -sS -o /tmp/dep-review.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$url")
          echo "Dependency graph compare HTTP ${code}"
          if grep -qi 'not supported' /tmp/dep-review.json; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Dependency graph 未开启，本 job 不阻塞 CI。开启方法见 README。"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Review dependencies
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --redact \
            --verbose

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Package jars for the scanner
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Scan dependencies
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.67.2 fs \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --skip-version-check \
            --ignorefile /work/.trivyignore \
            --skip-files '**/*pom.xml' \
            --skip-dirs frontend/node_modules \
            --skip-dirs e2e/node_modules \
            /work
